name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt pip-audit==2.9.0
      - run: ruff check .
      - run: pip-audit -r requirements.lock
      - name: Unit, UI, real fixture Chromium and OCR tests in non-root Docker
        run: docker build --target test -t collector-test .
      - name: Build runtime image
        run: docker build -t collector-pilot .
